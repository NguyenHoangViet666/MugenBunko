# Compose >= 2.24.4. Apply after docker-compose.yml; see docs/scaling.md.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD}', --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: [redis_data:/data]
    networks: [database]

  app:
    ports: !reset []
    deploy:
      replicas: 2
    environment:
      API_REPLICAS: 2
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      # One trusted host TLS proxy followed by the gateway below.
      TRUST_PROXY: 2
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${GATEWAY_PORT:-8080}:8080']
    volumes: ['./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      app:
        condition: service_healthy
    networks: [web]

volumes:
  redis_data:
