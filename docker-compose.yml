services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mugenbunko}
      MYSQL_USER: ${DB_APP_USER:-mugen_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 45s
    networks: [database]

  app:
    build: .
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment: &app_environment
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_APP_USER:-mugen_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mugenbunko}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-100}
      API_REPLICAS: ${API_REPLICAS:-1}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-30000}
      ACCOUNT_RATE_LIMIT: ${ACCOUNT_RATE_LIMIT:-1200}
      AUTH_IP_RATE_LIMIT: ${AUTH_IP_RATE_LIMIT:-3000}
      AUTH_ACCOUNT_RATE_LIMIT: ${AUTH_ACCOUNT_RATE_LIMIT:-15}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-mugenbunko:production}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads_data:/app/server/dist/uploads
    networks: [database, web]

  migrate:
    build: .
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app_environment
      DB_USER: root
      DB_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-mugen_app}
    command: ["node", "server/dist/migrateProduction.js"]
    networks: [database]

networks:
  database:
    internal: true
  web:
volumes:
  mysql_data:
  uploads_data:
