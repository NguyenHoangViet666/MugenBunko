services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mugenbunko}
      MYSQL_USER: ${DB_APP_USER:-mugen_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 45s
    networks: [database]

  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment: &app_environment
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_APP_USER:-mugen_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mugenbunko}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads_data:/app/server/dist/uploads
    networks: [database, web]

  migrate:
    build: .
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app_environment
      DB_USER: root
      DB_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-mugen_app}
    command: ["node", "server/dist/migrateProduction.js"]
    networks: [database]

networks:
  database:
    internal: true
  web:
volumes:
  mysql_data:
  uploads_data:
