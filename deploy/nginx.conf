# Gateway is loopback-only; the host TLS proxy must overwrite X-Forwarded-Proto.
resolver 127.0.0.11 valid=10s ipv6=off;
map $cookie_mugen_route $mugen_affinity {
    '' $request_id;
    default $cookie_mugen_route;
}
map $cookie_mugen_route $mugen_cookie {
    '' 'mugen_route=$request_id; Path=/; HttpOnly; Secure; SameSite=Lax';
    default '';
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $original_scheme {
    https https;
    default http;
}
upstream mugen_api {
    zone mugen_api 64k;
    hash $mugen_affinity consistent;
    server app:5000 resolve;
    keepalive 64;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header Set-Cookie $mugen_cookie always;
    location / {
        proxy_pass http://mugen_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        # Do not retry writes on another API after an ambiguous connection failure.
        proxy_next_upstream off;
    }
}
